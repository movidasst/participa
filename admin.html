<main class="wrap"><section class="card">
<div style="font-weight:800;font-size:.8rem;letter-spacing:.06em;color:var(--teal)">PARTICIPA · ADMINISTRACIÓN</div>
<h1>Resultados privados</h1>
<p>Ingresa con el correo y la contraseña de Gestión para ver los participantes, sus respuestas y descargar la base completa en Excel.</p>
<form id="loginForm">
<label for="email">Correo administrativo</label><input id="email" type="email" autocomplete="username" required>
<label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" required>
<button id="login" class="btn" type="submit">Ingresar a resultados</button></form>
<p id="error" class="error hidden" role="alert"></p>
<p class="note"><a href="index.html">Volver a la encuesta pública</a>. Los datos personales de los participantes son privados y no deben difundirse.</p>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
"use strict";
const client=window.supabase.createClient("https://lfdmbkzghnwvsapxypvt.supabase.co","sb_publishable_bRnkA6PA8-v073nrw9zxiQ_8rVGiOn1",{auth:{storageKey:"movidasst_participa_admin_auth",persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const $=id=>document.getElementById(id);
function issue(message){$("error").textContent=message;$("error").classList.remove("hidden")}
async function checkPermission(){
 const r=await client.rpc("participa_mercado_panel",{p_offset:0,p_limit:1});
 if(r.error||!r.data?.ok)throw Error("Esta cuenta no tiene permisos de administración.");
 window.location.replace("admin-mercado.html");
}
$("loginForm").addEventListener("submit",async event=>{
 event.preventDefault();$("login").disabled=true;$("error").classList.add("hidden");
 try{
  const r=await client.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});
  if(r.error)throw r.error;$("password").value="";await checkPermission();
 }catch(err){console.error(err);issue("No se pudo ingresar. Verifica tus credenciales de Gestión y los permisos de la cuenta.");$("login").disabled=false}
});
client.auth.getSession().then(r=>{if(r.data.session)checkPermission().catch(()=>{})}).catch(()=>{});
})();
</script></body></html>
